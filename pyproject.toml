[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "scrapers"
version = "0.1.0"
description = "Archive trips and convert archives and reminders to Pelican articles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "requests",
    "playwright",
    "numpy",
    "scipy",
    "geopandas",
    "matplotlib",
    "shapely",
    "Pillow",
]

[project.scripts]
scrapers = "scrapers:main"

[project.urls]
Repository = "https://github.com/lburais/scrapers"

[tool.hatch.build.targets.wheel]
only-include = [
    "aventures2rst.py",
    "findpenguins.py",
    "aventures_archive.py",
    "aventures_writers.py",
    "common_config.py",
    "common_utils.py",
    "findpenguins_archive.py",
    "findpenguins_config.py",
    "findpenguins_elevation.py",
    "findpenguins_parsers.py",
    "findpenguins_utils.py",
    "findpenguins_writers.py",
    "output_safety.py",
    "reminder.py",
    "reminders2rst.py",
    "scrapers.py",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "aventures2rst.py",
    "findpenguins.py",
    "aventures_archive.py",
    "aventures_writers.py",
    "common_config.py",
    "common_utils.py",
    "findpenguins_archive.py",
    "findpenguins_config.py",
    "findpenguins_elevation.py",
    "findpenguins_parsers.py",
    "findpenguins_utils.py",
    "findpenguins_writers.py",
    "output_safety.py",
    "reminder.py",
    "reminders2rst.py",
    "scrapers.py",
    "README.md",
    "pyproject.toml",
]
